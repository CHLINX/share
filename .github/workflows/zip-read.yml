name: Read uploaded ZIP for audit

on:
  push:
    branches:
      - audit/zip-read-20261104
    paths:
      - .github/workflows/zip-read.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and inspect ZIP
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import os
          import pathlib
          import urllib.request
          import zipfile

          url = "https://github.com/CHLINX/share/raw/refs/heads/main/OneDrive_1_2026-11-4.zip"
          zip_path = pathlib.Path("/tmp/source.zip")
          out_dir = pathlib.Path("audit_extracted").resolve()
          out_dir.mkdir(parents=True, exist_ok=True)

          req = urllib.request.Request(url, headers={"User-Agent": "GitHub-Actions-ZIP-Audit"})
          with urllib.request.urlopen(req, timeout=90) as response, zip_path.open("wb") as f:
              print("DOWNLOAD_STATUS:", response.status)
              print("CONTENT_LENGTH_HEADER:", response.headers.get("Content-Length"))
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  f.write(chunk)

          print("DOWNLOADED_BYTES:", zip_path.stat().st_size)
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              print("ZIP_INTEGRITY:", "OK" if bad is None else "FAILED:" + str(bad))
              infos = [i for i in zf.infolist() if not i.is_dir()]
              print("ENTRY_COUNT:", len(infos))
              print("TOTAL_UNCOMPRESSED_BYTES:", sum(i.file_size for i in infos))
              print("=== FILE MANIFEST ===")
              for i in infos:
                  print(f"{i.file_size:>12} bytes | {i.filename}")

              # Extract only regular files whose resolved paths remain inside the audit directory.
              for info in infos:
                  mode = (info.external_attr >> 16) & 0o170000
                  if mode == 0o120000:
                      print("SKIP_SYMLINK:", info.filename)
                      continue
                  target = (out_dir / info.filename).resolve()
                  if os.path.commonpath([str(out_dir), str(target)]) != str(out_dir):
                      print("SKIP_UNSAFE_PATH:", info.filename)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(info) as src, target.open("wb") as dst:
                      while True:
                          chunk = src.read(1024 * 1024)
                          if not chunk:
                              break
                          dst.write(chunk)

              print("=== CSV / TXT CONTENT SUMMARIES ===")
              text_infos = [i for i in infos if pathlib.PurePosixPath(i.filename).suffix.lower() in (".csv", ".txt")]
              if not text_infos:
                  print("NO_CSV_OR_TXT_FILES_FOUND")
              for info in text_infos:
                  print(f"--- TEXT_FILE: {info.filename} | bytes={info.file_size} ---")
                  raw = zf.read(info)
                  decoded = None
                  used_encoding = None
                  for enc in ("utf-8-sig", "cp950", "big5", "utf-16", "latin-1"):
                      try:
                          decoded = raw.decode(enc)
                          used_encoding = enc
                          break
                      except UnicodeDecodeError:
                          pass
                  print("ENCODING:", used_encoding or "unknown")
                  if pathlib.PurePosixPath(info.filename).suffix.lower() == ".csv":
                      try:
                          rows = list(csv.reader(io.StringIO(decoded or "")))
                          print("CSV_ROW_COUNT_INCLUDING_HEADER:", len(rows))
                          for row in rows[:31]:
                              print("CSV_ROW:", " | ".join(str(v).replace("\\n", " ")[:240] for v in row[:20]))
                          if len(rows) > 31:
                              print("CSV_PREVIEW_TRUNCATED_ROWS:", len(rows) - 31)
                      except Exception as e:
                          print("CSV_PARSE_ERROR:", repr(e))
                          print((decoded or "")[:8000])
                  else:
                      lines = (decoded or "").splitlines()
                      print("TXT_LINE_COUNT:", len(lines))
                      for line in lines[:120]:
                          print("TXT:", line[:500])
                      if len(lines) > 120:
                          print("TXT_PREVIEW_TRUNCATED_LINES:", len(lines) - 120)

              print("=== IMAGE METADATA ===")
              image_exts = {".jpg", ".jpeg", ".png", ".webp", ".bmp", ".gif", ".tif", ".tiff"}
              image_infos = [i for i in infos if pathlib.PurePosixPath(i.filename).suffix.lower() in image_exts]
              print("IMAGE_COUNT:", len(image_infos))
              try:
                  from PIL import Image
                  for info in image_infos:
                      try:
                          with Image.open(io.BytesIO(zf.read(info))) as im:
                              print(f"IMAGE: {info.filename} | format={im.format} | size={im.width}x{im.height} | mode={im.mode}")
                      except Exception as e:
                          print("IMAGE_READ_ERROR:", info.filename, repr(e))
              except Exception as e:
                  print("PIL_UNAVAILABLE:", repr(e))
              print("=== AUDIT_COMPLETE ===")
          PY
      - name: Upload extracted source files for inspection
        uses: actions/upload-artifact@v4
        with:
          name: zip-audit-extracted-source
          path: audit_extracted/
          if-no-files-found: error
          retention-days: 3
